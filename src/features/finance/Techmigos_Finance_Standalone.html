const STORE_KEY='techmigos-finance-standalone-v4';
const $=(s,root=document)=>root.querySelector(s);

const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);

const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

const round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;

function linkedInvoiceReceived(id){if(!id)return 0;return sum(state.transactions.filter(t=>t.type==='income'&&t.linkedInvoiceId===id&&t.status==='Received'),t=>t.amount)}
function invoiceStatus(i){
 if(i.status==='Paid'||i.status==='Cancelled'||i.status==='Draft')return i.status;
 if(!i.id||Number(i.amount)<=0)return i.status;
 const received=linkedInvoiceReceived(i.id);

}

async function refresh(){await saveState();renderPage();}
function cleanStr(v){return String(v||'').trim()}
function validAmount(v){let n=Number(v);return Number.isFinite(n)&&n>0?round(n):null}
function monthFor(date){return String(date||today()).slice(0,7)}
function doSave(form){return new FormData(form)}
async function handleForm(form){
  if(form.id==='approvalForm')return saveApproval(form);
  if(form.id==='invoiceTemplateForm')return saveInvoiceTemplate(form);
  if(form.id==='invoiceServicesForm')return saveInvoiceServices(form);if(form.id==='memberForm'){await saveMemberForm(form);return}if(form.id==='teamProjectsForm'){await saveTeamProjects(form);return}
  const d=doSave(form),id=form.dataset.id||'';
  if(form.id==='transactionForm'){
    const type=String(d.get('type')||'income'),amount=validAmount(d.get('amount'));
    if(amount===null){toast('Please enter a positive transaction amount.');return}
    const projectAllocations=expenseAllocationsFromForm(form,type,amount);
    const saved=state.transactions.find(t=>t.id===id),projectId=projectAllocations?'':String(d.get('projectId')||''),teamId=type==='salary'?String(d.get('teamId')||''):'';
    if(type==='salary'&&(!projectId||!teamId)){toast('Select both a project and its team for salary or team payout. Imported unassigned salaries can be allocated by editing them.');return}
    const proofIds=await saveProofs(form.querySelector('input[type=file]')?.files),record={
      id:id||uid('tx'),type,projectId,teamId,...(projectAllocations?{projectAllocations}:{}),
      date:String(d.get('date')||today()),description:cleanStr(d.get('description')),
      amount,status:String(d.get('status')||'Pending'),
      payee:cleanStr(d.get('payee')),notes:cleanStr(d.get('notes')),
      linkedInvoiceId:String(d.get('linkedInvoiceId')||saved?.linkedInvoiceId||''),
      proofIds:[...(saved?.proofIds||[]),...proofIds],source:saved?.source||'Manual',...(type==='income'&&saved?.companyOnly!==undefined?{companyOnly:saved.companyOnly}:{})
    };
    if(!record.date||!record.description){toast('Enter a date and description.');return}
    if(saved){state.transactions[state.transactions.findIndex(t=>t.id===id)]=record}else state.transactions.push(record);
    ui.selectedTxId=record.id;await refresh();toast(saved?'Transaction updated.':'Transaction saved.');return;
  }
  if(form.id==='projectForm'){
    const name=cleanStr(d.get('name')),client=cleanStr(d.get('client')),projectValue=validAmount(d.get('projectValue'));
    if(!name){toast('Project name is required.');return}
    if(projectValue===null){toast('Enter a positive fixed project value.');return}
    const existing=project(id);const rec={id:id||uid('prj'),name,client,projectValue,status:String(d.get('status')||'Active'),shares:existing?.shares||[],...(existing?.teamIds?{teamIds:existing.teamIds}:{}),...(existing?.invoiceTemplate?{invoiceTemplate:existing.invoiceTemplate}:{})};
    if(existing)state.projects[state.projects.findIndex(p=>p.id===id)]=rec;else state.projects.push(rec);
    await refresh();toast('Project saved.');return;
  }
  if(form.id==='shareForm'){
    const p=project(id);if(!p)return;
    const arr=[],seen=new Set();let total=0;
    for(const t of state.teams){const raw=Number(d.get(`share_${t.id}`)||0);if(!Number.isFinite(raw)||raw<0||raw>100){toast(`Invalid share percentage for ${t.name}.`);return}const percent=round(raw);if(percent>0){if(seen.has(t.id)){toast('A team was duplicated.');return}seen.add(t.id);arr.push({teamId:t.id,pct:percent});total=round(total+percent)}}
    if(total>100.00001){toast(`Team shares add to ${total}%. Total must be at most 100%.`);return}
    p.shares=arr;await refresh();toast(`Shares saved. Company retains ${round(100-total)}% of the fixed project value and all recurring income.`);return;
  }
  if(form.id==='teamForm'){
    const name=cleanStr(d.get('name'));if(!name){toast('Team name required.');return}
    if(state.teams.some(t=>t.name.toLowerCase()===name.toLowerCase()&&t.id!==id)){toast('A team with this name already exists.');return}
    if(id){let t=team(id);if(t)t.name=name}else state.teams.push({id:uid('team'),name});
    await refresh();toast('Team saved.');return;
  }
  if(form.id==='invoiceForm'){
    const amount=validAmount(d.get('amount')),projectId=String(d.get('projectId')||''),invoiceNo=cleanStr(d.get('invoiceNo'));
    if(amount===null||!projectId||!project(projectId)){toast('Choose a project and a positive amount.');return}
    if(state.invoices.some(x=>x.invoiceNo.toLowerCase()===invoiceNo.toLowerCase()&&x.id!==id)){toast('Invoice number already in use.');return}
    const existing=state.invoices.find(x=>x.id===id);
    const rec={id:id||uid('inv'),invoiceNo,projectId,description:cleanStr(d.get('description')),amount,
      issuedDate:String(d.get('issuedDate')||today()),dueDate:String(d.get('dueDate')||''),
      status:String(d.get('status')||'Pending'),notes:cleanStr(d.get('notes')),companyOnly:Boolean(d.has('companyOnly')||d.has('recurring')||existing?.templateId||existing?.source==='Recurring'),
      proofIds:existing?.proofIds||[],templateId:existing?.templateId||'',period:existing?.period||'',source:existing?.source||'Manual'};
    if(!rec.description||!rec.issuedDate||!rec.dueDate){toast('Invoice title, issue date and due date are required.');return}
    if(existing){if(existing.items&&existing.amount===rec.amount&&existing.description===rec.description)rec.items=existing.items;state.invoices[state.invoices.findIndex(x=>x.id===id)]=rec}
    else {
      if(d.get('recurring')){
        const day=Math.min(28,Math.max(1,Number(d.get('billingDay'))||Number(rec.dueDate.slice(-2))||1));
        const template={id:uid('rec'),projectId,title:rec.description,amount,dayOfMonth:day,startDate:rec.dueDate,notes:rec.notes,enabled:true};
        state.recurringTemplates.push(template);
        rec.templateId=template.id;rec.period=monthFor(rec.dueDate);
      }
      state.invoices.push(rec);
    }
    await generateRecurring(false);await refresh();toast('Invoice saved. Download it from the invoice list.');return;
  }
  if(form.id==='planForm'){
    const amount=validAmount(d.get('amount')),projectId=String(d.get('projectId')||''),day=Number(d.get('dayOfMonth')),title=cleanStr(d.get('title'));
    if(!project(projectId)||amount===null||!title||!Number.isInteger(day)||day<1||day>28){toast('Enter a valid project, title, amount, and due day (1–28).');return}
    const template={id:id||uid('rec'),projectId,title,amount,dayOfMonth:day,startDate:String(d.get('startDate')||today()),notes:cleanStr(d.get('notes')),enabled:d.has('enabled')};
    if(id){const k=state.recurringTemplates.findIndex(t=>t.id===id);if(k<0)return;state.recurringTemplates[k]=template}else state.recurringTemplates.push(template);
    await generateRecurring(false);await refresh();toast('Monthly billing plan saved.');return;
  }
  if(form.id==='settingsForm'){
    state.settings.businessName=cleanStr(d.get('businessName'))||'Techmigos';
    state.settings.businessEmail=cleanStr(d.get('businessEmail'));
    state.settings.businessPhone=cleanStr(d.get('businessPhone'));
    state.settings.businessAddress=cleanStr(d.get('businessAddress'));
    await refresh();toast('Business information saved.');return;
  }
}
async function generateRecurring(showNotice=true){
  const currentMonth=monthFor(today()),maxMonth=addMonths(currentMonth,1);let count=0;
  for(const t of state.recurringTemplates){if(!t.enabled||!project(t.projectId))continue;
    const firstMonth=monthFor(t.startDate),start=new Date(firstMonth+'-01T12:00:00');
    const end=new Date(maxMonth+'-01T12:00:00');
    for(let n=0;n<48;n++){
      const period=addMonths(firstMonth,n);if(period>maxMonth)break;
      const dueDate=`${period}-${String(Math.min(28,Math.max(1,Number(t.dayOfMonth)||1))).padStart(2,'0')}`;
      // New invoices cannot predate the explicit plan start date.
      if(dueDate<t.startDate)continue;
      if(state.invoices.some(i=>i.templateId===t.id&&i.period===period))continue;
      const id=uid('inv');state.invoices.push({id,invoiceNo:nextInvoiceNumber(),projectId:t.projectId,description:t.title,amount:round(t.amount),
        issuedDate:period===currentMonth?today():`${period}-01`,dueDate,status:'Pending',notes:t.notes||'',proofIds:[],templateId:t.id,period,source:'Recurring'});
      count++;
    }
  }
  
  if(showNotice){toast(count?`${count} monthly invoice${count===1?'':'s'} generated.`:'All monthly invoices are already generated through next month.');await refresh()}
  return count;
}
function dateFile(){return today().replaceAll('-','')}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1800)}
function csvCell(v){let t=String(v??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'}
function downloadCsv(kind){
 const lines=kind==='invoices'?[
 ['Invoice number','Project','Client','Description','Amount INR','Issued date','Due date','Status','Recurring','Source'],
 ...state.invoices.map(i=>[i.invoiceNo,projectName(i.projectId),project(i.projectId)?.client||'',i.description,i.amount.toFixed(2),i.issuedDate,i.dueDate,i.status,i.templateId?'Monthly':'No',i.source])
 ]:[
 ['Date','Description','Project','Type','Amount INR','Status','Team','Paid to / from','Invoice ID','Proof count','Notes','Source','Project allocation INR'],
 ...state.transactions.map(t=>[t.date,t.description,transactionProjectName(t),t.type,t.amount.toFixed(2),t.status,teamName(t.teamId),t.payee||'',t.linkedInvoiceId||'',(t.proofIds||[]).length,t.notes||'',t.source||'',(t.projectAllocations||[]).map(a=>`${projectName(a.projectId)}: ${a.amount.toFixed(2)}`).join(' / ')])
 ];
 const data='\uFEFF'+lines.map(row=>row.map(csvCell).join(',')).join('\r\n');downloadBlob(new Blob([data],{type:'text/csv;charset=utf-8'}),`Techmigos_${kind}_${dateFile()}.csv`);
 toast('CSV exported.');
}
const fileToDataUrl=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
async function backupAll(){try{
  const files=await proofOp('all');let attachments=[];
  for(const f of files)attachments.push({id:f.id,name:f.name,size:f.size,mime:f.mime,addedAt:f.addedAt,dataUrl:await fileToDataUrl(f.blob)});
  const payload={format:'TechmigosFinanceBackup-v1',exportedAt:new Date().toISOString(),state,proofs:attachments};
  downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`Techmigos_FullBackup_${dateFile()}.json`);
  toast(`Full backup exported with ${files.length} proof file(s).`);
 }catch(e){console.error(e);toast('Full backup failed. Check IndexedDB and download permissions.');}
}
async function restoreAll(file){return restoreCloudBackup(file)}
function safeFilename(s){return String(s||'document').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,90)}
function pdfEscape(v){return String(v??'').replace(/[\u2012-\u2015]/g,'-').replace(/\u20b9/g,'INR ').replace(/[^\x20-\x7e]/g,' ').replace(/[\\()]/g,'\\$&')}
async function proofAction(kind,id){const item=await proofOp('get',id);if(!item){toast('Proof not found. Restore a backup.');return}
 if(kind==='download-proof'){downloadBlob(item.blob,safeFilename(item.name)||'proof.pdf');return}
 if(kind==='open-proof'&&!/^(application\/pdf|image\/(png|jpeg|webp|gif|bmp|avif)|audio\/|video\/)/.test(item.mime)){downloadBlob(item.blob,safeFilename(item.name));return}
 if(kind==='open-proof'){const url=URL.createObjectURL(item.blob);const tab=window.open(url,'_blank','noopener,noreferrer');if(!tab)downloadBlob(item.blob,safeFilename(item.name));setTimeout(()=>URL.revokeObjectURL(url),120000)}
}

 if(kind==='delete-project'){
  const p=project(id);if(!p)return;
  if(state.transactions.some(t=>window.FinanceProjectFinance.transactionInProject(t,id))||state.invoices.some(i=>i.projectId===id)||state.recurringTemplates.some(r=>r.projectId===id)){toast('Project has financial records or monthly plans. Reassign them before deleting the project.');return}
  if(!confirm(`Delete project ${p.name}?`))return;state.projects=state.projects.filter(p=>p.id!==id);closeModal();await refresh();toast('Project removed.');return;
 }
 if(kind==='delete-plan'){
  const r=state.recurringTemplates.find(x=>x.id===id);if(!r||!confirm(`Delete monthly plan ${r.title}? Existing invoices will be preserved.`))return;
  state.recurringTemplates=state.recurringTemplates.filter(x=>x.id!==id);closeModal();await refresh();toast('Plan deleted; historic invoices remain.');return;
 }
 if(kind==='delete-team'){
  const t=team(id);if(!t)return;
  if(state.projects.some(p=>p.teamIds?.includes(id)||p.shares.some(s=>s.teamId===id))||state.transactions.some(x=>x.teamId===id)){toast('Team is used in project shares or salary payments. Reassign records before removing it.');return}
  if(!confirm(`Remove team ${t.name}?`))return;state.teams=state.teams.filter(x=>x.id!==id);await refresh();toast('Team removed.');return;
 }
}
function updateSearch(el){const name=el.dataset.filter,value=el.value;
 if(name.startsWith('tx-'))ui.txFilters[name.slice(3)]=value;
 if(name.startsWith('invoice-'))ui.invoiceFilters[name.slice(8)]=value;
 const selectionStart=typeof el.selectionStart==='number'?el.selectionStart:null;
 const changed=el.dataset.filter;renderPage();
 if(el.tagName==='INPUT'){
   const next=$$('[data-filter]').find(e=>e.dataset.filter===changed);if(next){next.focus();if(selectionStart!==null&&next.type==='text')next.setSelectionRange(selectionStart,selectionStart)}
 }
}
async function actionHandler(node,event){
 if(!isFinanceAdmin()){await memberAction(node);return}
 const act=node.dataset.act,id=node.dataset.id||'';
 if(ui.cloudBusy||ui.saving&&act!=='close-modal'){toast('Please wait for the current save to finish.');return}
 switch(act){
 case 'logout':await window.TechmigosFinanceAuth.signOut();break;
 case 'nav':await goto(node.dataset.page);break;
 case 'add-tx':showTransactionModal();break;
 case 'add-tx-project':showTransactionModal(null,{projectId:id});break;
 case 'edit-tx':showTransactionModal(state.transactions.find(t=>t.id===id));break;
 case 'switch-tx-type':{
   if(node.dataset.type==='invoice'){showInvoiceModal();break}
   const f=$('#transactionForm');if(!f)break;
   const original=state.transactions.find(t=>t.id===f.dataset.id)||null;
   const prev=new FormData(f),preset={type:node.dataset.type,date:String(prev.get('date')||today()),projectId:String(prev.get('projectId')||''),description:String(prev.get('description')||''),amount:String(prev.get('amount')||''),payee:String(prev.get('payee')||''),notes:String(prev.get('notes')||''),teamId:String(prev.get('teamId')||''),linkedInvoiceId:String(prev.get('linkedInvoiceId')||'')};
   preset.status=preset.type==='income'?'Received':(prev.get('status')==='Pending'?'Pending':'Paid');
   showTransactionModal(original,preset);break;
 }
 case 'select-tx':{
   if(ui.page!=='transactions'){ui.txFilters={type:'',project:'',status:'',search:'',month:''};ui.page='transactions'}
   ui.selectedTxId=id;ui.selectedProofId=null;render();break;
 }
 case 'close-inspector':ui.selectedTxId=null;ui.selectedProofId=null;renderPage();break;
 case 'select-proof':ui.selectedProofId=id;renderProofArea();break;
 case 'equal-expense-split':refreshExpenseSplit(true);break;
 case 'approve-missing-proof':showApprovalModal(id);break;
 case 'attach-tx-proof':ui.proofAttachTxId=id;$('#inspectorFile')?.click();break;
 case 'open-proof':case 'download-proof':await proofAction(act,id);break;
 case 'remove-proof':await deleteProof(id);break;
 case 'delete-tx':case 'delete-invoice':case 'delete-project':case 'delete-team':case 'delete-plan':await listDelete(act,id);break;
 case 'project-detail':ui.detailProjectId=id;ui.detailTab='overview';ui.detailTeamId='';ui.detailCompanySelected=false;await goto('projectDetail');break;
 case 'preview-company-transactions':case 'preview-team-transactions':case 'clear-project-team':{
   const company=act==='preview-company-transactions'||(act==='clear-project-team'&&ui.detailCompanySelected);
   const teamId=act==='clear-project-team'?ui.detailTeamId:node.dataset.team;
   if(ui.page!=='projectDetail'||ui.detailTab!=='overview'||(!company&&!project(ui.detailProjectId)?.shares.some(s=>s.teamId===teamId)))break;
   ui.detailCompanySelected=act==='preview-company-transactions'&&!ui.detailCompanySelected;
   ui.detailTeamId=company||act==='clear-project-team'||ui.detailTeamId===teamId?'':teamId;
   renderPage();
   const button=company?$('button[data-act="preview-company-transactions"]'):$$('button[data-act="preview-team-transactions"]').find(button=>button.dataset.team===teamId);
   button?.focus({preventScroll:true});break;
 }
 case 'project-tab':ui.detailTab=node.dataset.tab;renderPage();break;
 case 'add-project':showProjectModal();break;
 case 'edit-project':showProjectModal(project(id));break;
 case 'edit-shares':showSharesModal(id);break;
 case 'add-team':showTeamModal();break;
 case 'add-member':showMemberModal(null,node.dataset.team);break;
 case 'assign-team-projects':showTeamProjects(id);break;
 case 'edit-member':showMemberModal(ui.members.find(m=>m.uid===id));break;
 case 'edit-team':showTeamModal(team(id));break;
 case 'pay-team':{
   let p=project(node.dataset.project),m=projectMetrics(node.dataset.project),part=m.shares.find(s=>s.teamId===node.dataset.team);
   if(!p||!part||part.remaining<=0){toast('This team has no outstanding payout on the selected project.');break}
   showTransactionModal(null,{type:'salary',projectId:p.id,teamId:part.teamId,description:`${part.teamName} — project share payout`,amount:part.remaining,status:'Paid',date:today(),payee:part.teamName});break;
 }
 case 'add-invoice':showInvoiceModal();break;
 case 'add-invoice-project':showInvoiceModal(null,{projectId:id});break;
 case 'view-invoice':await showInvoiceDetail(id);break;
 case 'edit-invoice':showInvoiceModal(state.invoices.find(x=>x.id===id));break;
 case 'pdf-invoice':await downloadInvoice(id);break;
 case 'print-invoice':await printInvoice(id);break;
 case 'invoice-templates':showInvoiceTemplatePicker();break;
 case 'invoice-template':showInvoiceTemplate(id);break;
 case 'customize-invoice':showInvoiceServices(id);break;
 case 'clear-template-image':ui.templateDraft[node.dataset.image]='';$('#'+node.dataset.image+'-status').textContent='Image removed';break;
 case 'add-invoice-item':if($$('[data-item-row]').length>=24){toast('An invoice can include up to 24 services.');break}$('#invoiceItems').insertAdjacentHTML('beforeend',invoiceItemRow({description:'',quantity:1,unit:'Service',rate:0},uid('item')));updateInvoiceItemsTotal();break;
 case 'remove-invoice-item':node.closest('[data-item-row]').remove();updateInvoiceItemsTotal();break;
 case 'receipt-invoice':closeModal();newReceipt(id);break;
 case 'add-plan':showPlanModal();break;
 case 'edit-plan':showPlanModal(state.recurringTemplates.find(t=>t.id===id));break;
 case 'toggle-plan':{const t=state.recurringTemplates.find(t=>t.id===id);if(t){t.enabled=!t.enabled;await generateRecurring(false);await refresh();toast(t.enabled?'Monthly plan resumed.':'Monthly plan paused.')}break;}
 case 'generate-recurring':await generateRecurring(true);break;
 case 'submit-form':{let f=document.getElementById(node.dataset.form);f?.requestSubmit();break;}
 case 'close-modal':closeModal();break;
 case 'modal-overlay':if(event.target===node)closeModal();break;
 case 'clear-tx-filters':ui.txFilters={type:'',project:'',status:'',search:'',month:''};renderPage();break;
 case 'clear-invoice-filters':ui.invoiceFilters={project:'',status:'',search:''};renderPage();break;
 case 'csv':downloadCsv(node.dataset.kind||'transactions');break;
 case 'backup':await backupAll();break;
 case 'reset-data':{
   if(!confirm('Reset all finance records to the original Excel import and DELETE every uploaded proof? Export your full backup first.'))break;
   if(!confirm('Final confirmation: replace the shared workspace and permanently delete its uploaded proof files?'))break;
   await resetCloudData();break;
 }
 default:break;
 }
}
function registerHandlers(){
 window.addEventListener('beforeunload',event=>{if(ui.savePending||ui.saving){event.preventDefault();event.returnValue=''}});
 document.addEventListener('click',async e=>{const node=e.target.closest('[data-act]');if(!node)return;
   if(node.dataset.act==='select-tx'&&e.target.closest('button'))return;
   try{await actionHandler(node,e)}catch(error){cloudError(error)}});
 document.addEventListener('keydown',e=>{
   if(e.key==='Escape'&&$('#modalHost .modal-wrap'))closeModal();
   if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act="select-tx"]')){e.preventDefault();e.target.click()}
 });
 document.addEventListener('submit',async e=>{if(!['transactionForm','invoiceForm','projectForm','shareForm','teamForm','planForm','settingsForm','memberForm','teamProjectsForm','invoiceTemplateForm','invoiceServicesForm','approvalForm'].includes(e.target.id))return;
   e.preventDefault();if(ui.saving)return;ui.saving=true;ui.didSave=false;const form=e.target;const buttons=$$('#modalHost button[data-act="submit-form"],#settingsForm button[type="submit"]');buttons.forEach(b=>b.disabled=true);
   try{await handleForm(form);if(ui.didSave&&form.id!=='settingsForm')closeModal()}
   catch(error){const field=form.querySelector('.form-error');if(field)field.textContent=error.message;cloudError(error)}
   finally{ui.saving=false;buttons.forEach(b=>b.disabled=false);if(ui.pendingCloud&&!$('#modalHost .modal-wrap'))reloadCloud().catch(cloudError)}
 });
 document.addEventListener('input',e=>{
   if(e.target.matches('#transactionForm [name=amount]'))refreshExpenseSplit(true);
   if(e.target.matches('#transactionForm [name^=allocation_]'))refreshExpenseSplit();
   if(e.target.closest('#invoiceServicesForm'))updateInvoiceItemsTotal();
   if(e.target.classList.contains('share-entry')){
     let fields=$$('.share-entry'),sumval=fields.reduce((s,x)=>s+(Number(x.value)||0),0);
     const preview=$('#companySharePreview');if(preview){preview.textContent=`${round(100-sumval)}%`;preview.style.color=sumval>100?'#d04755':'#e48e24'}
   }
   if(e.target.matches('input[data-filter][type=text]'))updateSearch(e.target);
 });
 document.addEventListener('change',async e=>{
   const el=e.target;
   try{
   if(el.id==='expense-shared'||el.hasAttribute('data-expense-project')){refreshExpenseSplit(true);return}
   if(el.dataset.approvalImage){await readApprovalImage(el);return}
   if(el.dataset.templateImage){await readTemplateImage(el);return}
   if(el.dataset.filter&&!(el.type==='text')){updateSearch(el);return}
   if(el.id==='invoiceRecurring'){$('#recurrenceFields').hidden=!el.checked;return}
   if(el.id==='inspectorFile'&&el.files?.length){
     const t=state.transactions.find(x=>x.id===ui.proofAttachTxId);if(!t)return;
     const ids=await saveProofs(el.files);t.proofIds=[...(t.proofIds||[]),...ids];ui.selectedProofId=ids[0]||null;await refresh();toast(`${ids.length} proof${ids.length===1?'':'s'} attached.`);el.value='';return;
   }
   if(el.id==='restoreInput'&&el.files?.length){await restoreAll(el.files[0]);el.value='';return}
   }catch(error){cloudError(error)}
 });
}
// FINANCE_ALLOCATION_UI
// FINANCE_APPROVAL_UI
// FINANCE_INVOICE_UI
// FINANCE_CLOUD_UI
registerHandlers();
window.addEventListener('finance-ready',()=>bootFinance(),{once:true});
</script>
