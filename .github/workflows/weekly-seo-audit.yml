name: Weekly Site and Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate built site and SEO metadata
        run: node scripts/validate-site.mjs
      - name: npm dependency audit
        run: npm run security:audit
      - name: OSV lockfile audit
        if: always()
        run: npm run security:osv
      - name: Source security scan
        if: always()
        run: npm run security:scan
